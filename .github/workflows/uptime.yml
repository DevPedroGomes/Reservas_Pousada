name: Monitor de disponibilidade

# Falha aqui gera o e-mail padrão do GitHub de workflow com erro. O agendamento do
# Actions pode atrasar alguns minutos: serve para saber da queda antes do cliente,
# não para medir SLA. Em repo sem atividade por 60 dias o GitHub desliga o agendamento.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: API e banco respondem
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors --max-time 15 --output /dev/null https://api.diaria.gomio.com.br/health
      - name: Site responde
        run: curl --fail --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors --max-time 15 --output /dev/null https://diaria.gomio.com.br/
