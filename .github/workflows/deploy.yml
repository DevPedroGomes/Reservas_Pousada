name: Build & push image (VPS auto-pulls)

on:
  push:
    branches: [main]
  # PR de dependência sem CI é merge no escuro: testes, lint e build rodam aqui.
  # Publicar imagem e conferir produção continuam só na main.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Portao de qualidade. Nada e publicado se isto falhar.
  #
  # Antes, o unico gate era o `tsc` que rodava por dentro do `docker compose
  # build`: nenhum teste, nenhuma verificacao de comportamento. Bug de regra de
  # negocio (double-booking, fuso horario, papel sem permissao) ia direto para
  # producao sem nada no caminho.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teste
          POSTGRES_PASSWORD: teste
          POSTGRES_DB: reservas_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend - deps
        working-directory: backend
        run: npm ci

      - name: Backend - typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Backend - testes (unitarios + integracao)
        working-directory: backend
        env:
          # O suite de integracao aplica as migrations do ZERO neste banco: e
          # tambem o teste de que um deploy limpo sobe.
          DATABASE_URL: postgresql://teste:teste@localhost:5432/reservas_teste
          CPF_ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
          BETTER_AUTH_SECRET: segredo-de-teste-do-ci-com-mais-de-32-caracteres
          # Runner em UTC, igual ao container de producao — e assim que os
          # testes de fuso pegam a regressao.
          TZ: UTC
        run: npm test

      - name: Frontend - deps
        working-directory: frontend
        run: npm ci

      - name: Frontend - typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Frontend - lint
        working-directory: frontend
        run: npx next lint

      - name: Frontend - build
        working-directory: frontend
        run: npx next build

  # Sem `|| true` nem continue-on-error: aviso alto ou crítico em dependência de
  # produção deixa o job vermelho e segura a publicação. O que fica abaixo do
  # corte (os moderados do esbuild do drizzle-kit, ver docs/deploy-producao.md)
  # aparece inteiro no resumo do job, para não sumir de vista.
  auditoria:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: npm audit (backend e frontend)
        shell: bash
        run: |
          falhou=0
          for pacote in backend frontend; do
            {
              echo "### npm audit --omit=dev: ${pacote}"
              echo '```'
              (cd "$pacote" && npm audit --omit=dev) || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if ! (cd "$pacote" && npm audit --omit=dev --audit-level=high); then
              echo "::error title=npm audit::${pacote} tem aviso alto ou crítico em dependência de produção"
              falhou=1
            fi
          done
          exit "$falhou"

  build:
    needs: [test, auditoria]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: deploy-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    outputs:
      moveu_latest: ${{ steps.publicar.outputs.moveu_latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login no GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Cada imagem sai com DUAS tags: o sha do commit (imutável — é o que
      # permite rollback para uma versão exata) e latest (o que o auto-pull da
      # VPS consome). Antes só existia latest: voltar uma versão exigia rebuild.
      # APP_VERSION grava o mesmo sha na imagem do backend: é o que /health/live
      # responde e o que o job verificar-producao confere.
      - name: Build + push (so os servicos buildados, nao upstream)
        id: publicar
        # O frontend embute as NEXT_PUBLIC_* no BUILD, e o runner nao tem o
        # .env da VPS. Elas vem das Variables do repositorio (Settings ->
        # Secrets and variables -> Actions -> Variables). Sao valores publicos
        # (vao para o navegador); segredo nenhum entra aqui. Vazia = o
        # docker-compose usa o padrao (paginas legais mostram "[a definir]",
        # GA/Pixel desligados).
        env:
          NEXT_PUBLIC_EMPRESA_RAZAO_SOCIAL: ${{ vars.NEXT_PUBLIC_EMPRESA_RAZAO_SOCIAL }}
          NEXT_PUBLIC_EMPRESA_CNPJ: ${{ vars.NEXT_PUBLIC_EMPRESA_CNPJ }}
          NEXT_PUBLIC_EMPRESA_ENDERECO: ${{ vars.NEXT_PUBLIC_EMPRESA_ENDERECO }}
          NEXT_PUBLIC_EMPRESA_FORO: ${{ vars.NEXT_PUBLIC_EMPRESA_FORO }}
          NEXT_PUBLIC_CONTATO_EMAIL: ${{ vars.NEXT_PUBLIC_CONTATO_EMAIL }}
          NEXT_PUBLIC_PRIVACIDADE_EMAIL: ${{ vars.NEXT_PUBLIC_PRIVACIDADE_EMAIL }}
          NEXT_PUBLIC_ENCARREGADO_NOME: ${{ vars.NEXT_PUBLIC_ENCARREGADO_NOME }}
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
          NEXT_PUBLIC_META_PIXEL_ID: ${{ vars.NEXT_PUBLIC_META_PIXEL_ID }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        shell: bash
        run: |
          # O aviso do next build fica dentro do log do Docker: aqui ele vira
          # anotação na página do run.
          for variavel in NEXT_PUBLIC_EMPRESA_RAZAO_SOCIAL NEXT_PUBLIC_EMPRESA_CNPJ NEXT_PUBLIC_EMPRESA_ENDERECO \
                          NEXT_PUBLIC_EMPRESA_FORO NEXT_PUBLIC_CONTATO_EMAIL NEXT_PUBLIC_ENCARREGADO_NOME; do
            if [ -z "${!variavel}" ]; then
              echo "::warning title=Dados da empresa::${variavel} vazia: /privacidade e /termos publicam [a definir]"
            fi
          done
          export IMAGE_TAG="${GITHUB_SHA::12}"
          export APP_VERSION="${IMAGE_TAG}"
          docker compose build
          docker compose push backend frontend
          # Dois pushes seguidos podem terminar fora de ordem. O latest é o que a VPS
          # consome, então só o topo da main pode movê-lo; a tag por sha fica de qualquer jeito.
          topo="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "${GITHUB_SHA}" != "${topo}" ]; then
            echo "Publicado só como ${IMAGE_TAG}: a main já está em ${topo::12}" >> "$GITHUB_STEP_SUMMARY"
            echo "moveu_latest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          for servico in backend frontend; do
            imagem="ghcr.io/devpedrogomes/reservas_pousada/${servico}"
            docker tag "${imagem}:${IMAGE_TAG}" "${imagem}:latest"
            docker push "${imagem}:latest"
          done
          echo "moveu_latest=true" >> "$GITHUB_OUTPUT"
          echo "Publicado: ${IMAGE_TAG}" >> "$GITHUB_STEP_SUMMARY"

  # Publicar não é entregar: a VPS puxa a imagem sozinha, e esse auto-pull já
  # ficou parado sem nenhum alerta. Este job falha se a API não passar a servir
  # o commit publicado. Recuperação: docs/deploy-producao.md.
  #
  # Só a conferência de um run que moveu o latest entra no grupo compartilhado:
  # um push mais novo cancela a do anterior, cujo sha nunca mais apareceria em
  # produção. Um run superado fica num grupo só dele. Como os builds rodam em
  # fila, o run mais antigo pode terminar depois do mais novo, e no grupo
  # compartilhado a conferência dele cancelaria a do topo da main.
  verificar-producao:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ needs.build.outputs.moveu_latest == 'true' && format('verificar-producao-{0}', github.repository) || format('verificar-producao-{0}-{1}', github.repository, github.sha) }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Esperar a API servir o commit publicado (ate 15 min)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Commit superado não vai ao ar: quem responde é o run do topo da main.
          topo="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" -q .sha)"
          if [ "${GITHUB_SHA}" != "${topo}" ]; then
            echo "Conferência dispensada: a main já está em ${topo::12}" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          esperado="${GITHUB_SHA::12}"
          url="https://api.diaria.gomio.com.br/health/live"
          prazo=$((SECONDS + 900))
          servindo="sem resposta"
          while [ "$SECONDS" -lt "$prazo" ]; do
            servindo="$(curl -fsS --max-time 10 "$url" | jq -r '.version // "sem o campo version"')" || servindo="sem resposta"
            if [ "$servindo" = "$esperado" ]; then
              echo "Producao servindo ${esperado}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Producao em '${servindo}', esperando '${esperado}'"
            sleep 30
          done
          echo "::error title=Producao atrasada::${url} serve '${servindo}' depois de 15 min; publicado: '${esperado}'. Ver docs/deploy-producao.md, secao Recuperacao."
          echo "Producao atrasada: serve '${servindo}', publicado '${esperado}'" >> "$GITHUB_STEP_SUMMARY"
          exit 1
