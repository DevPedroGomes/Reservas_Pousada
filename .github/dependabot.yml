# Atualizações agrupadas por semana. Correção de segurança abre PR à parte, sem
# esperar o ciclo. O CI roda em todo PR: nada entra sem testes, lint e build.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      menores:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # tailwind-merge 3 só funciona com Tailwind 4; o projeto está no 3. Volta junto da migração.
      - dependency-name: tailwind-merge
        update-types: [version-update:semver-major]
    groups:
      menores:
        update-types: [minor, patch]
  # As actions estão fixadas por SHA; é daqui que vem a atualização delas.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
