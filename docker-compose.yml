services:
  # MIGRATED 2026-05-07 -> central-db (/opt/docker/central-db).
  # Service kept commented for rollback. Volume postgres_data preserved.
  # Rollback: uncomment, revert backend DATABASE_URL host above to postgres, remove `databases` from backend networks, re-add depends_on.
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: reservas-db
  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 256m
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER:-reservas}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  #     POSTGRES_DB: ${POSTGRES_DB:-reservas_pousada}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #     - ./backend/migrations:/docker-entrypoint-initdb.d:ro
  #   networks:
  #     - internal
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reservas} -d ${POSTGRES_DB:-reservas_pousada}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # Backend API (Express + TypeScript)
  backend:
    image: ghcr.io/devpedrogomes/reservas_pousada/backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reservas-backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-reservas}:${POSTGRES_PASSWORD}@central-db:5432/${POSTGRES_DB:-reservas_pousada}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # Endereco canonico da API. E o que o better-auth usa para montar o
      # callback do OAuth — mudar aqui exige a URI nova no Google Console.
      BETTER_AUTH_URL: https://api.diaria.pgdev.com.br
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Lista: o host antigo continua aceito durante a migracao de dominio.
      CORS_ORIGIN: https://diaria.pgdev.com.br,https://minhapousada.pgdev.com.br
      # Endereco canonico do app — e o que vai nos links de convite e email.
      APP_URL: https://diaria.pgdev.com.br
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Default vazio de proposito: o runner do GitHub builda SEM .env, e um
      # `${VAR:?}` faria o `docker compose build` falhar na interpolacao antes
      # mesmo de comecar. Quem barra a chave ausente e o boot do servidor
      # (assertCpfCryptoConfigurada), que e onde importa — e la a checagem e
      # mais forte, porque valida o formato e faz round-trip da cifra.
      CPF_ENCRYPTION_KEY: ${CPF_ENCRYPTION_KEY:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      # --- Billing (Stripe) ---
      # Interruptor explicito: sem ele nenhum limite de plano e aplicado. Existe
      # para que ligar a cobranca seja decisao deliberada, e para que um deploy
      # sem chave nao derrube o acesso de quem paga.
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Ids de Price do Stripe. Diferentes entre teste e producao, por isso vem
      # do ambiente. Plano sem Price nao aparece na tela de planos.
      STRIPE_PRICE_ESSENCIAL_MENSAL: ${STRIPE_PRICE_ESSENCIAL_MENSAL:-}
      STRIPE_PRICE_ESSENCIAL_ANUAL: ${STRIPE_PRICE_ESSENCIAL_ANUAL:-}
      STRIPE_PRICE_POUSADA_MENSAL: ${STRIPE_PRICE_POUSADA_MENSAL:-}
      STRIPE_PRICE_POUSADA_ANUAL: ${STRIPE_PRICE_POUSADA_ANUAL:-}
      STRIPE_PRICE_REDE_MENSAL: ${STRIPE_PRICE_REDE_MENSAL:-}
      STRIPE_PRICE_REDE_ANUAL: ${STRIPE_PRICE_REDE_ANUAL:-}
      # Taxa usada SO como estimativa, quando o Stripe nao expoe o encargo real.
      STRIPE_TAXA_PERCENTUAL: ${STRIPE_TAXA_PERCENTUAL:-3.99}
      STRIPE_TAXA_FIXA_CENTAVOS: ${STRIPE_TAXA_FIXA_CENTAVOS:-39}
      # --- Painel de margem ---
      # Quem enxerga a area administrativa. Vazio = ninguem. Vive no ambiente,
      # nao no banco: papel de super-admin gravado em tabela e coluna que
      # alguem pode escrever.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Custo fixo mensal de infra a ratear entre os pagantes. 0 = nao
      # configurado, e o painel avisa em vez de mostrar margem inflada.
      CUSTO_INFRA_MENSAL_CENTAVOS: ${CUSTO_INFRA_MENSAL_CENTAVOS:-0}
    networks:
      - internal
      - proxy
      - databases
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.reservas-api.entrypoints=https"
      # Dois hosts em paralelo: o novo e o antigo, para a migracao nao ter
      # janela de queda e continuar tendo caminho de volta.
      - "traefik.http.routers.reservas-api.rule=Host(`api.diaria.pgdev.com.br`) || Host(`api-pousada.pgdev.com.br`)"
      - "traefik.http.routers.reservas-api.tls=true"
      - "traefik.http.routers.reservas-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.reservas-api.middlewares=reservas-api-security@docker,global-ratelimit@file,strip-server-header@file"
      - "traefik.http.services.reservas-api.loadbalancer.server.port=4000"
      # Security Headers (OBRIGATORIO)
      - "traefik.http.middlewares.reservas-api-security.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.reservas-api-security.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.reservas-api-security.headers.stsPreload=true"
      - "traefik.http.middlewares.reservas-api-security.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.reservas-api-security.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.reservas-api-security.headers.browserXssFilter=true"
      - "traefik.http.middlewares.reservas-api-security.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.reservas-api-security.headers.frameDeny=true"
      - "traefik.http.middlewares.reservas-api-security.headers.contentSecurityPolicy=default-src 'none'; frame-ancestors 'none'"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Next.js)
  frontend:
    image: ghcr.io/devpedrogomes/reservas_pousada/frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.diaria.pgdev.com.br
        NEXT_PUBLIC_APP_URL: https://diaria.pgdev.com.br
    container_name: reservas-frontend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256m
    environment:
      NODE_ENV: production
    depends_on:
      - backend
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pousada-frontend.entrypoints=https"
      - "traefik.http.routers.pousada-frontend.rule=Host(`diaria.pgdev.com.br`) || Host(`minhapousada.pgdev.com.br`)"
      - "traefik.http.routers.pousada-frontend.tls=true"
      - "traefik.http.routers.pousada-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.routers.pousada-frontend.middlewares=pousada-frontend-security@docker,global-ratelimit@file,strip-server-header@file"
      - "traefik.http.services.pousada-frontend.loadbalancer.server.port=3000"
      # Security Headers (OBRIGATORIO)
      - "traefik.http.middlewares.pousada-frontend-security.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.pousada-frontend-security.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.pousada-frontend-security.headers.stsPreload=true"
      - "traefik.http.middlewares.pousada-frontend-security.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.pousada-frontend-security.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.pousada-frontend-security.headers.browserXssFilter=true"
      - "traefik.http.middlewares.pousada-frontend-security.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.pousada-frontend-security.headers.frameDeny=true"
      - "traefik.http.middlewares.pousada-frontend-security.headers.contentSecurityPolicy=default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.diaria.pgdev.com.br https://api-pousada.pgdev.com.br https://accounts.google.com; frame-ancestors 'none'"
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  proxy:
    external: true
  databases:
    external: true
  internal:
    driver: bridge

volumes:
  postgres_data:
    driver: local
