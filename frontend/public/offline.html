<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f2ed">
  <title>Sem conexão: Diária</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f4f2ed; color: #14120e;
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; text-align: center; }
    img { width: 64px; height: 64px; border-radius: 16px; }
    h1 { font-size: 20px; margin: 16px 0 8px; }
    p { color: #665f52; font-size: 15px; line-height: 1.5; max-width: 320px; margin: 0 auto 20px; }
    button { height: 44px; padding: 0 20px; border: 0; border-radius: 999px; background: #b24a18; color: #fff; font-size: 15px; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <img src="/icones/icone-192.png" alt="">
    <h1>Sem conexão</h1>
    <p>Para ver reservas e hóspedes atualizados, o Diária precisa de internet. Assim que a conexão voltar, é só tentar de novo.</p>
    <button onclick="location.reload()">Tentar de novo</button>
  </main>
</body>
</html>
